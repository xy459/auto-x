[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "browser-custom"
version = "0.1.0"
description = "Standalone CloakBrowser + Playwright persistent profile manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cloakbrowser[geoip]>=0.5.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psutil>=5.9",
  "httpx>=0.27",
  "socksio>=1.0",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.7",
]

[project.scripts]
browser-custom = "browser_custom.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_custom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["browser_custom"]
