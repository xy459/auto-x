[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "x-ops"
version = "0.1.0"
description = "Task-program runtime for single-account X operations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "browser-custom>=0.1.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "keyring>=25.0",
  "pydantic>=2.6",
  "uvicorn[standard]>=0.29",
  "x-actions-playwright>=1.0.0",
]

[project.scripts]
x-ops = "x_ops.__main__:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/x_ops"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "src",
  "../../packages/x-actions-playwright/src",
  "../browser-custom/src",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/x_ops/api/*.py" = ["B008"]
"src/x_ops/task_sdk/cancellation.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
packages = ["x_ops"]
check_untyped_defs = true
