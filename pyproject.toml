[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-custom"
version = "0.1.0"
description = "Standalone CloakBrowser + Playwright persistent profile manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cloakbrowser[geoip]>=0.5.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psutil>=5.9",
  "httpx>=0.27",
  "socksio>=1.0",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[project.scripts]
browser-custom = "browser_custom.__main__:main"

[tool.setuptools.packages.find]
include = ["browser_custom*"]

[tool.setuptools.package-data]
browser_custom = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
